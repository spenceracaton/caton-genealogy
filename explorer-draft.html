<title>Caton Research Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap">
<style>
/* Four palettes, switched by data-palette on <html>. "dusk" is the default. */
:root, :root[data-palette="dusk"]{
  --bg:#181C27; --bg-glow:#232838; --glass:rgba(32,36,50,.78); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#ECEEF4; --ink-2:#AEB4C4; --ink-3:#7A8194; --plate:#2A2F40; --plate-ink:#D8DCE8;
  --direct:#F1E9D6; --identified:#7EC6EA; --candidate:#E4B66C; --unresolved:#8E96A8; --rejected:#E27F90;
  --edge:rgba(236,238,244,.42); --guide:rgba(255,255,255,.045); --glow-alpha:.28; --shadow:0 16px 40px rgba(0,0,0,.35);
  --scheme:dark;
}
:root[data-palette="paper"]{
  --bg:#F2EEE5; --bg-glow:#FAF7F0; --glass:rgba(255,253,248,.78); --line:rgba(40,36,28,.10); --line-2:rgba(40,36,28,.18);
  --ink:#25282F; --ink-2:#585D68; --ink-3:#868B97; --plate:#FFFDF8; --plate-ink:#3A3E47;
  --direct:#3B352C; --identified:#2E7EB0; --candidate:#B8792A; --unresolved:#9A9EA8; --rejected:#C3505F;
  --edge:rgba(37,40,47,.38); --guide:rgba(40,36,28,.06); --glow-alpha:.16; --shadow:0 16px 40px rgba(60,50,30,.15);
  --scheme:light;
}
:root[data-palette="sage"]{
  --bg:#1F2724; --bg-glow:#2A3430; --glass:rgba(38,48,44,.78); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#EAEEEA; --ink-2:#AEB8B2; --ink-3:#7C8781; --plate:#2D3934; --plate-ink:#D9E0DB;
  --direct:#F0E8D4; --identified:#8FD3C2; --candidate:#E6BB72; --unresolved:#8F9B95; --rejected:#E28A8A;
  --edge:rgba(234,238,234,.42); --guide:rgba(255,255,255,.045); --glow-alpha:.26; --shadow:0 16px 40px rgba(0,0,0,.35);
  --scheme:dark;
}
:root[data-palette="ink"]{
  --bg:#07080C; --bg-glow:#0E1119; --glass:rgba(14,16,22,.82); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#E8EAF0; --ink-2:#A6ACBB; --ink-3:#6C7386; --plate:#161922; --plate-ink:#D6D9E2;
  --direct:#F4F0E6; --identified:#5DC9F5; --candidate:#F3B44B; --unresolved:#7F8799; --rejected:#F2607A;
  --edge:rgba(232,234,240,.5); --guide:rgba(255,255,255,.035); --glow-alpha:.34; --shadow:0 16px 40px rgba(0,0,0,.5);
  --scheme:dark;
}
:root{--ease:cubic-bezier(.2,.7,.2,1);--rail:264px;--panel:400px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Inter",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;color-scheme:var(--scheme);transition:background .4s}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(1100px 700px at 58% 45%,var(--bg-glow) 0%,var(--bg) 70%);transition:background .4s}
canvas#graph{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#graph.grabbing{cursor:grabbing}
canvas#graph.pointer{cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ---------- left rail ---------- */
.rail{position:absolute;top:0;left:0;bottom:0;width:var(--rail);z-index:4;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 16px;overflow-y:auto;scrollbar-width:none}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--identified);box-shadow:0 0 10px var(--identified)}
.brand h1{margin:0;font:600 13.5px/1.2 "Inter",sans-serif;letter-spacing:.005em}
.brand p{margin:2px 0 0;font:10.5px "IBM Plex Mono",monospace;color:var(--ink-3)}
.search{position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--ink);border-radius:9px;font:13px "Inter",sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--identified);box-shadow:0 0 0 3px color-mix(in srgb,var(--identified) 18%,transparent)}
.search svg{position:absolute;left:11px;top:10px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.8;pointer-events:none}
.search .results{position:absolute;top:42px;left:0;right:0;overflow:hidden;display:none;box-shadow:var(--shadow);z-index:2}
.search .results.open{display:block}
.search .results button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 12px;border:0;background:none;color:var(--ink);text-align:left;font:12.5px "Inter",sans-serif;cursor:pointer}
.search .results button:hover,.search .results button.active{background:rgba(127,127,127,.12)}
.search .results button b{width:7px;height:7px;border-radius:50%;flex:none}
.search .results button .q{color:var(--ink-3);font-size:11px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.group h4{margin:0 0 8px;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:9px}
.seg button{flex:1;border:0;background:none;color:var(--ink-2);padding:6px 10px;border-radius:7px;font:500 12px "Inter",sans-serif;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:rgba(127,127,127,.18);color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none;padding:8px 2px 0}
.toggle input{appearance:none;width:30px;height:17px;border-radius:9px;background:rgba(127,127,127,.3);position:relative;margin:0;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink);transition:transform .2s var(--ease)}
.toggle input:checked{background:var(--candidate)}
.toggle input:checked::after{transform:translateX(13px);background:var(--bg)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.swatches button{border:1px solid var(--line);background:none;padding:4px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-3);font:10.5px "Inter",sans-serif;transition:border-color .2s,color .2s}
.swatches button[aria-pressed="true"]{border-color:var(--identified);color:var(--ink)}
.swatches button i{display:block;width:100%;height:22px;border-radius:5px;border:1px solid rgba(127,127,127,.25);position:relative;overflow:hidden}
.swatches button i::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%}
.sw-dusk{background:#181C27}.sw-dusk::after{background:#7EC6EA}
.sw-paper{background:#F2EEE5}.sw-paper::after{background:#2E7EB0}
.sw-sage{background:#1F2724}.sw-sage::after{background:#8FD3C2}
.sw-ink{background:#07080C}.sw-ink::after{background:#5DC9F5}
.legend{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:20px;height:0;border-top:1.5px solid var(--edge)}
.legend i.hyp{border-top:1.5px dashed var(--candidate)}
.legend i.rej{border-top:1.5px dotted var(--rejected)}
.legend i.bnd{border-top:1.5px dotted var(--unresolved)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px;border:2px solid var(--unresolved);background:var(--plate)}
.legend b.direct{border-color:var(--direct);box-shadow:0 0 8px color-mix(in srgb,var(--direct) 60%,transparent)}
.legend b.identified{border-color:var(--identified);box-shadow:0 0 8px color-mix(in srgb,var(--identified) 60%,transparent)}
.legend b.candidate{border-color:var(--candidate);box-shadow:0 0 8px color-mix(in srgb,var(--candidate) 60%,transparent)}
.rail .foot{margin-top:auto;font:10.5px/1.5 "IBM Plex Mono",monospace;color:var(--ink-3)}
.rail .foot kbd{font:inherit;padding:0 4px;border:1px solid var(--line-2);border-radius:3px;color:var(--ink-2)}

/* ---------- bottom-right zoom ---------- */
.zoom{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;padding:3px;transition:right .45s var(--ease)}
.zoom.shift{right:calc(var(--panel) + 16px)}
.zoom button{border:0;background:none;color:var(--ink-2);width:30px;height:30px;border-radius:7px;cursor:pointer;display:grid;place-items:center;font:500 15px "Inter",sans-serif}
.zoom button:hover{background:rgba(127,127,127,.15);color:var(--ink)}
.zoom button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- right panel ---------- */
.panel{position:absolute;top:0;right:0;bottom:0;width:var(--panel);max-width:100%;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--line);z-index:5;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s var(--ease);box-shadow:var(--shadow)}
.panel.open{transform:translateX(0)}
.panel-head{padding:16px 20px 0;flex:none}
.panel-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.ib{border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--ink-2);width:28px;height:28px;border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s,background .2s}
.ib:hover{color:var(--ink);border-color:var(--line-2);background:rgba(127,127,127,.14)}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.hops{display:flex;align-items:center;gap:6px;font:11.5px "IBM Plex Mono",monospace;color:var(--ink-3);border:1px solid var(--line);border-radius:7px;padding:2px 4px}
.hops button{border:0;background:none;color:var(--ink-2);width:22px;height:22px;border-radius:5px;cursor:pointer;font:14px "IBM Plex Mono",monospace;line-height:1}
.hops button:hover{background:rgba(127,127,127,.15);color:var(--ink)}
.hops .v{color:var(--ink);min-width:10px;text-align:center}
.spacer{flex:1}
.identity{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.portrait{width:64px;height:64px;border-radius:50%;background:var(--plate);border:2.5px solid var(--unresolved);display:grid;place-items:center;font:500 22px "Newsreader",Georgia,serif;color:var(--plate-ink);position:relative;overflow:hidden}
.portrait.direct{border-color:var(--direct)}.portrait.identified{border-color:var(--identified)}.portrait.candidate{border-color:var(--candidate)}
.portrait::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(127,127,127,.22) 0 26%,transparent 27%),radial-gradient(ellipse at 50% 100%,rgba(127,127,127,.22) 0 38%,transparent 39%)}
.portrait span{position:relative}
.status{display:inline-flex;align-items:center;gap:7px;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--unresolved)}
.status.direct::before{background:var(--direct)}.status.identified::before{background:var(--identified)}.status.candidate::before{background:var(--candidate)}
.panel h2{margin:0;font:600 21px/1.15 "Inter",sans-serif;letter-spacing:-.015em;text-wrap:balance}
.panel .years{font:12.5px "Inter",sans-serif;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.panel .qual{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-block;padding:3px 8px;border-radius:6px;font:500 11px "Inter",sans-serif;border:1px solid var(--line)}
.chip.warn{background:color-mix(in srgb,var(--candidate) 14%,transparent);color:var(--candidate);border-color:color-mix(in srgb,var(--candidate) 40%,transparent)}
.chip.mono{font-family:"IBM Plex Mono",monospace;color:var(--ink-3)}
.chip.photo{color:var(--ink-3);cursor:pointer}
.chip.photo:hover{color:var(--ink);border-color:var(--line-2)}
.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--ink-3);padding:8px 10px;font:500 12px "Inter",sans-serif;cursor:pointer;position:relative;transition:color .2s}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--identified)}
.tabs button .n{font:10.5px "IBM Plex Mono",monospace;color:var(--ink-3);margin-left:5px}
.panel-body{flex:1;overflow-y:auto;padding:16px 20px 28px;scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.3) transparent}
.section{opacity:0;transform:translateY(6px);animation:rise .35s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.section+.section{margin-top:20px}
.section h3{margin:0 0 8px;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--ink-3);margin:0}
.facts dd{margin:0;color:var(--ink)}
.facts dd .c{font:10.5px "IBM Plex Mono",monospace;color:var(--identified);margin-left:6px}
.facts dd .conflict{display:block;font-size:12px;color:var(--candidate);margin-top:2px}
.note{font-size:12.5px;line-height:1.55;color:var(--ink-2);margin:0}
.rel{list-style:none;margin:0 -8px;padding:0;display:flex;flex-direction:column}
.rel li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .15s}
.rel li:hover{background:rgba(127,127,127,.12)}
.rel li .pt{width:28px;height:28px;border-radius:50%;background:var(--plate);border:2px solid var(--unresolved);display:grid;place-items:center;font:500 11px "Newsreader",Georgia,serif;color:var(--plate-ink)}
.rel li .pt.direct{border-color:var(--direct)}.rel li .pt.identified{border-color:var(--identified)}.rel li .pt.candidate{border-color:var(--candidate)}
.rel li .who{font:500 12.5px "Inter",sans-serif;color:var(--ink)}
.rel li .who small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.rel li .tag{font:10.5px "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap;padding:2px 6px;border:1px solid var(--line);border-radius:5px}
.rel li .tag.hypothesis{color:var(--candidate);border-color:color-mix(in srgb,var(--candidate) 40%,transparent)}
.rel li .tag.rejected{color:var(--rejected);border-color:color-mix(in srgb,var(--rejected) 40%,transparent)}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px;border:1px solid var(--line);border-radius:9px;background:rgba(127,127,127,.05);cursor:pointer;transition:border-color .2s,background .2s}
.doc:hover{border-color:var(--line-2);background:rgba(127,127,127,.1)}
.doc .thumb{width:40px;height:52px;border-radius:3px;background:repeating-linear-gradient(0deg,rgba(127,127,127,.18) 0 2px,transparent 2px 7px);border:1px solid var(--line-2);position:relative}
.doc .thumb::after{content:attr(data-kind);position:absolute;left:0;right:0;bottom:0;font:500 8.5px "IBM Plex Mono",monospace;text-align:center;background:rgba(127,127,127,.25);color:var(--ink-2);padding:2px 0;letter-spacing:.05em}
.doc .t{font:500 12.5px "Inter",sans-serif;color:var(--ink)}
.doc .m{font:11px "IBM Plex Mono",monospace;color:var(--ink-3);margin-top:2px}
.doc .why{font-size:12px;color:var(--ink-2);margin-top:5px}
.claims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.claims li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;font-size:12.5px}
.claims .id{font:11.5px "IBM Plex Mono",monospace;color:var(--identified)}
.claims .g{font:10.5px "IBM Plex Mono",monospace;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:12.5px}
.focus-btn{margin-top:14px;width:100%;padding:9px;border:1px solid var(--line-2);background:rgba(127,127,127,.06);color:var(--ink);border-radius:8px;font:500 12.5px "Inter",sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.focus-btn:hover{border-color:var(--identified);background:color-mix(in srgb,var(--identified) 14%,transparent)}

@media (prefers-reduced-motion: reduce){.panel,.zoom{transition:none}.section{animation:none;opacity:1;transform:none}}
@media (max-width:760px){
  :root{--rail:0px}
  .rail{bottom:auto;width:100%;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;gap:10px;padding:10px 16px;align-items:center}
  .rail .brand p,.rail .group.legend-g,.rail .foot,.rail .group.theme-g h4{display:none}
  .rail .search{flex:1 1 200px}
  .rail .group{display:flex;gap:8px;align-items:center}
  .rail .group h4{margin:0}
  .panel{top:auto;height:58%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(100%)}
  .panel.open{transform:translateY(0)}
  .zoom{display:none}
}
</style>

<div id="app">
  <canvas id="graph"></canvas>

  <nav class="rail" id="rail">
    <div class="brand"><span class="dot"></span><div><h1>Caton research graph</h1><p>26 people · 210 claims · synthesis 15 Sep 2026</p></div></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find a person or alias…" autocomplete="off" aria-label="Find a person">
      <div class="results glass" id="results" role="listbox"></div>
    </div>
    <div class="group">
      <h4>View</h4>
      <div class="seg" role="group" aria-label="View">
        <button id="viewFamily" aria-pressed="true">Family</button>
        <button id="viewResearch" aria-pressed="false">Research</button>
      </div>
      <label class="toggle"><span>Show hypotheses</span><input type="checkbox" id="hyp" checked></label>
    </div>
    <div class="group theme-g">
      <h4>Palette</h4>
      <div class="swatches" id="swatches">
        <button data-p="dusk" aria-pressed="true"><i class="sw-dusk"></i>Dusk</button>
        <button data-p="paper" aria-pressed="false"><i class="sw-paper"></i>Paper</button>
        <button data-p="sage" aria-pressed="false"><i class="sw-sage"></i>Sage</button>
        <button data-p="ink" aria-pressed="false"><i class="sw-ink"></i>Ink</button>
      </div>
    </div>
    <div class="group legend-g">
      <h4>Legend</h4>
      <div class="legend">
        <i></i><span>Established</span>
        <i class="hyp"></i><span>Hypothesis</span>
        <i class="rej"></i><span>Rejected</span>
        <i class="bnd"></i><span>Identity boundary</span>
        <b class="direct"></b><span>Direct line</span>
        <b class="identified"></b><span>Identified</span>
        <b class="candidate"></b><span>Candidate</span>
        <b></b><span>Unresolved</span>
      </div>
    </div>
    <div class="foot">click a person · drag to pan · scroll to zoom<br><kbd>esc</kbd> clear · <kbd>/</kbd> search · <kbd>f</kbd> fit · <kbd>+</kbd><kbd>−</kbd> hops</div>
  </nav>

  <div class="zoom glass" id="zoom">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zfit" title="Fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-head">
      <div class="panel-nav">
        <button id="back" class="ib" title="Previous selection" disabled><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="hops"><button id="hopMinus">−</button><span>hops <span class="v" id="hopV">1</span></span><button id="hopPlus">+</button></div>
        <span class="spacer"></span>
        <button id="close" class="ib" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="head"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="panel-body" id="body"></div>
  </aside>
</div>

<script>
/* =========================================================
   DATA — hand-cut slice of people.jsonl / claims.jsonl.
   gen: generation relative to Aaron (0). col: hand-laid column.
   photo: optional data: URI; none exist in evidence/ today, so
   every node renders a placeholder portrait with initials.

/* ---------- layout ---------- */
const COLW=132, ROWH=176;
const byId = Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const initials = p => p.name.split(/\s+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).slice(0,2).join('');
PEOPLE.forEach(p=>{ p.tx=p.col*COLW; p.ty=p.gen*ROWH; p.x=p.tx*0.4; p.y=p.ty*0.4; p.r=(p.status==='direct'?17:14)+Math.min(3,Math.sqrt(p.claims)); p.alpha=1; p.ta=1; p.ini=initials(p); p.img=null;
  if(p.photo){ const im=new Image(); im.onload=()=>{p.img=im;}; im.src=p.photo; } });

let view='family', showHyp=true;
function vis(a){ if(a==='hypothesis') return showHyp; if(a==='rejected'||a==='boundary') return view==='research'; return true; }
const activeEdges=()=>EDGES.filter(e=>vis(e.a));
function neighbors(id){ const s=new Set(); activeEdges().forEach(e=>{ if(e.s===id) s.add(e.t); if(e.t===id) s.add(e.s); }); return s; }
function within(id,h){ const seen=new Set([id]); let fr=[id]; for(let i=0;i<h;i++){ const nx=[]; fr.forEach(f=>neighbors(f).forEach(n=>{ if(!seen.has(n)){seen.add(n);nx.push(n);} })); fr=nx; } return seen; }

/* ---------- camera ---------- */
const cam={x:0,y:0,k:1,tx:0,ty:0,tk:1};
let W=0,H=0,DPR=1;
const canvas=document.getElementById('graph'), ctx=canvas.getContext('2d');
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*DPR; canvas.height=H*DPR; }
addEventListener('resize',resize); resize();
const isNarrow=()=>matchMedia('(max-width:760px)').matches;
const railW=()=>isNarrow()?0:264, panelW=()=>isNarrow()?0:400;
function viewCenter(){ const l=railW(), r=panelOpen?panelW():0; if(isNarrow()){ return [W/2, panelOpen? H*.42/2+30 : H/2+30]; } return [l+(W-l-r)/2, H/2]; }
function toScreen(x,y){ const [cx,cy]=viewCenter(); return [(x-cam.x)*cam.k+cx,(y-cam.y)*cam.k+cy]; }
function toWorld(sx,sy){ const [cx,cy]=viewCenter(); return [(sx-cx)/cam.k+cam.x,(sy-cy)/cam.k+cam.y]; }
function flyTo(x,y,k){ cam.tx=x; cam.ty=y; if(k) cam.tk=k; }
function fit(){ const xs=PEOPLE.map(p=>p.tx), ys=PEOPLE.map(p=>p.ty); const minx=Math.min(...xs)-90,maxx=Math.max(...xs)+90,miny=Math.min(...ys)-70,maxy=Math.max(...ys)+90; const aw=W-railW()-(panelOpen?panelW():0); const k=Math.min(aw/(maxx-minx),H/(maxy-miny),1.5); flyTo((minx+maxx)/2,(miny+maxy)/2,k); }

/* ---------- selection ---------- */
let selected=null, hovered=null, hops=1, history=[], panelOpen=false;
function setSelection(id,{push=true,fly=true}={}){
  if(push && selected && selected!==id) history.push(selected);
  selected=id; document.getElementById('back').disabled=history.length===0;
  if(id){ openPanel(id); const p=byId[id]; if(fly) flyTo(p.tx,p.ty,Math.max(cam.tk,1.1)); } else closePanel();
  updateAlphas();
}
function updateAlphas(){ if(!selected){ PEOPLE.forEach(p=>p.ta=1); return; } const keep=within(selected,hops); PEOPLE.forEach(p=>p.ta=keep.has(p.id)?1:.16); }

/* ---------- theme ---------- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C={};
function readTheme(){ C={direct:css('--direct'),identified:css('--identified'),candidate:css('--candidate'),unresolved:css('--unresolved'),rejected:css('--rejected'),ink:css('--ink'),ink2:css('--ink-2'),ink3:css('--ink-3'),bg:css('--bg'),plate:css('--plate'),plateInk:css('--plate-ink'),edge:css('--edge'),guide:css('--guide'),glow:parseFloat(css('--glow-alpha')),light:css('--scheme')==='light'}; }
function setPalette(p,{save=true}={}){ document.documentElement.setAttribute('data-palette',p); document.querySelectorAll('#swatches button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p)); readTheme(); if(save){ try{localStorage.setItem('caton-palette',p);}catch(e){} } }

const col=p=>C[p.status];
const edgeStyle=a=>a==='hypothesis'?{c:C.candidate,d:[6,5]}:a==='rejected'?{c:C.rejected,d:[2,4]}:a==='boundary'?{c:C.unresolved,d:[1,5]}:{c:C.edge,d:[]};
let t0=performance.now();

/* ---------- drawing ---------- */
function portrait(p,x,y,r,sel,hov){
  const c=col(p);
  // halo
  const pulse = sel? 1+0.1*Math.sin((performance.now()-t0)/450) : 1;
  const gr=r*(sel?2.6:hov?2.2:1.8)*pulse; const g=ctx.createRadialGradient(x,y,r*.8,x,y,gr);
  g.addColorStop(0,c); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalCompositeOperation=C.light?'source-over':'lighter';
  ctx.globalAlpha=p.alpha*(sel?C.glow*1.8:hov?C.glow*1.4:p.status==='unresolved'?C.glow*.4:C.glow); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,gr,0,7); ctx.fill();
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=p.alpha;
  // plate
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=C.plate; ctx.fill();
  if(p.img){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r-1,0,7); ctx.clip(); ctx.drawImage(p.img,x-r,y-r,r*2,r*2); ctx.restore(); }
  else { // faint silhouette + initials
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r-1,0,7); ctx.clip();
    ctx.fillStyle=C.plateInk; ctx.globalAlpha=p.alpha*.13;
    ctx.beginPath(); ctx.arc(x,y-r*.22,r*.36,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,y+r*.95,r*.72,r*.62,0,0,7); ctx.fill();
    ctx.restore(); ctx.globalAlpha=p.alpha;
    ctx.font=`500 ${Math.max(8,r*.78)}px Newsreader, Georgia, serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=C.plateInk; ctx.fillText(p.ini,x,y+r*.05);
  }
  // ring
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.strokeStyle=c; ctx.lineWidth=Math.max(1.5,2.2*cam.k); ctx.stroke();
  if(sel){ ctx.beginPath(); ctx.arc(x,y,r+5,0,7); ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.globalAlpha=p.alpha*.8; ctx.stroke(); }
}
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  cam.x+=(cam.tx-cam.x)*.1; cam.y+=(cam.ty-cam.y)*.1; cam.k+=(cam.tk-cam.k)*.1;
  for(const p of PEOPLE){ p.x+=(p.tx-p.x)*.08; p.y+=(p.ty-p.y)*.08; p.alpha+=(p.ta-p.alpha)*.12; }
  const S=(x,y)=>toScreen(x,y); const nb=selected?within(selected,hops):null;
  // arcs
  for(const l of LINKS){ if(!vis(l.a)) continue; const a=byId[l.s], b=byId[l.t];
    const [ax,ay]=S(a.x,a.y), [bx,by]=S(b.x,b.y); const st=edgeStyle(l.a); const emph=selected&&(l.s===selected||l.t===selected);
    ctx.globalAlpha=Math.min(a.alpha,b.alpha)*(emph?1:.7); ctx.strokeStyle=st.c; ctx.setLineDash(st.d); ctx.lineWidth=emph?1.8:1.1;
    const lift=(l.a==='boundary'?-56:-48)*cam.k; const mx=(ax+bx)/2, my=Math.min(ay,by)+lift;
    ctx.beginPath(); ctx.moveTo(ax,ay-a.r*cam.k); ctx.quadraticCurveTo(mx,my,bx,by-b.r*cam.k); ctx.stroke();
  }
  // tree connectors
  for(const f of FAMILIES){ if(!vis(f.a)) continue; const st=edgeStyle(f.a); const ps=f.parents.map(i=>byId[i]), cs=f.children.map(i=>byId[i]);
    const emph=selected&&[...f.parents,...f.children].includes(selected);
    const al=Math.min(...ps.map(p=>p.alpha),...cs.map(c=>c.alpha)), alMax=Math.max(...ps.map(p=>p.alpha),...cs.map(c=>c.alpha));
    ctx.strokeStyle=st.c; ctx.setLineDash(st.d); ctx.lineWidth=emph?1.9:1.2;
    let ux,uy;
    if(ps.length===2){ const [x1,y1]=S(ps[0].x,ps[0].y), [x2,y2]=S(ps[1].x,ps[1].y); const r1=ps[0].r*cam.k, r2=ps[1].r*cam.k; ctx.globalAlpha=Math.min(ps[0].alpha,ps[1].alpha)*(emph?1:.75); ctx.beginPath(); ctx.moveTo(x1+r1,y1); ctx.lineTo(x2-r2,y2); ctx.stroke(); ux=(x1+x2)/2; uy=(y1+y2)/2; }
    else { [ux,uy]=S(ps[0].x,ps[0].y); uy+=ps[0].r*cam.k; }
    if(!cs.length) continue;
    const busY=S(0,ps[0].y)[1]+ROWH*(f.bo||.5)*cam.k;
    const xs=cs.map(c=>S(c.x,c.y)[0]); const minx=Math.min(ux,...xs), maxx=Math.max(ux,...xs);
    ctx.globalAlpha=(selected?Math.max(al,alMax*.5):1)*(emph?1:.75);
    ctx.beginPath(); ctx.moveTo(ux,uy); ctx.lineTo(ux,busY); ctx.moveTo(minx,busY); ctx.lineTo(maxx,busY); ctx.stroke();
    cs.forEach(c=>{ const [cx,cy]=S(c.x,c.y); ctx.globalAlpha=(selected?Math.min(c.alpha,Math.max(al,alMax*.5)):1)*(emph?1:.75); ctx.beginPath(); ctx.moveTo(cx,busY); ctx.lineTo(cx,cy-c.r*cam.k); ctx.stroke(); });
  }
  ctx.setLineDash([]);
  // nodes
  for(const p of PEOPLE){ const [x,y]=S(p.x,p.y); portrait(p,x,y,p.r*cam.k,p.id===selected,p.id===hovered); }
  // labels
  for(const p of PEOPLE){ const inNb=nb&&nb.has(p.id); if(!(cam.k>.5||p.status==='direct'||inNb||p.id===hovered)) continue;
    const [x,y]=S(p.x,p.y); const r=p.r*cam.k; const big=p.id===selected||p.id===hovered;
    ctx.globalAlpha=p.alpha; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font=`${big?600:500} ${big?12.5:11.5}px Inter, system-ui, sans-serif`; ctx.fillStyle=big?C.ink:C.ink2; ctx.fillText(p.name,x,y+r+7);
    if(p.years&&(cam.k>.85||big)){ ctx.font='400 10px "IBM Plex Mono", monospace'; ctx.fillStyle=C.ink3; ctx.fillText(p.years,x,y+r+22); }
  }
  { const p=byId.aaron; if(p.alpha>.5){ const [x,y]=S(p.x,p.y); ctx.globalAlpha=p.alpha; ctx.font='500 10px "IBM Plex Mono", monospace'; ctx.fillStyle=C.candidate; ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('PARENTS UNKNOWN', x+p.r*cam.k+8, y-p.r*cam.k-2); } }
  ctx.globalAlpha=1;
}
function loop(now){ draw(now); requestAnimationFrame(loop); }

/* ---------- pointer ---------- */
function hit(sx,sy){ let best=null,bd=1e9; for(const p of PEOPLE){ const [x,y]=toScreen(p.x,p.y); const d=Math.hypot(x-sx,y-sy); if(d<p.r*cam.k+6&&d<bd){bd=d;best=p;} } return best; }
let down=null, moved=false;
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); down={x:e.offsetX,y:e.offsetY,cx:cam.tx,cy:cam.ty}; moved=false; canvas.classList.add('grabbing'); });
canvas.addEventListener('pointermove',e=>{ if(down){ const dx=e.offsetX-down.x, dy=e.offsetY-down.y; if(Math.hypot(dx,dy)>3) moved=true; cam.tx=down.cx-dx/cam.k; cam.ty=down.cy-dy/cam.k; cam.x=cam.tx; cam.y=cam.ty; return; } const p=hit(e.offsetX,e.offsetY); hovered=p?p.id:null; canvas.classList.toggle('pointer',!!p); });
canvas.addEventListener('pointerup',e=>{ if(down&&!moved){ const p=hit(e.offsetX,e.offsetY); if(p) setSelection(p.id); else if(selected) setSelection(null,{push:false}); } down=null; canvas.classList.remove('grabbing'); });
canvas.addEventListener('pointerleave',()=>{hovered=null;});
function zoomAt(sx,sy,f){ const nk=Math.min(3,Math.max(.35,cam.tk*f)); const [wx,wy]=toWorld(sx,sy); cam.tx=wx-(wx-cam.tx)*(cam.tk/nk); cam.ty=wy-(wy-cam.ty)*(cam.tk/nk); cam.tk=nk; }
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*.0015)); },{passive:false});
document.getElementById('zin').onclick=()=>{ const [cx,cy]=viewCenter(); zoomAt(cx,cy,1.35); };
document.getElementById('zout').onclick=()=>{ const [cx,cy]=viewCenter(); zoomAt(cx,cy,1/1.35); };
document.getElementById('zfit').onclick=fit;
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'){ if(e.key==='Escape'){e.target.blur();closeResults();} return; }
  if(e.key==='Escape') setSelection(null,{push:false});
  if(e.key==='+'||e.key==='=') setHops(hops+1); if(e.key==='-') setHops(hops-1);
  if(e.key==='Backspace'&&history.length){ e.preventDefault(); goBack(); }
  if(e.key==='/'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key==='f') fit();
});

/* ---------- panel ---------- */
const panel=document.getElementById('panel'), headEl=document.getElementById('head'), tabsEl=document.getElementById('tabs'), bodyEl=document.getElementById('body'), zoomEl=document.getElementById('zoom');
let tab='overview';
function openPanel(id){ panelOpen=true; panel.classList.add('open'); zoomEl.classList.add('shift'); renderPanel(id); }
function closePanel(){ panelOpen=false; panel.classList.remove('open'); zoomEl.classList.remove('shift'); }
document.getElementById('close').onclick=()=>setSelection(null,{push:false});
function goBack(){ const prev=history.pop(); setSelection(prev,{push:false}); }
document.getElementById('back').onclick=goBack;
function setHops(h){ hops=Math.min(4,Math.max(0,h)); document.getElementById('hopV').textContent=hops; updateAlphas(); if(selected&&tab==='overview') renderPanel(selected); }
document.getElementById('hopPlus').onclick=()=>setHops(hops+1);
document.getElementById('hopMinus').onclick=()=>setHops(hops-1);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const relLabel={spouse:'spouse',parent:'parent of',child:'child of',sibling:'sibling',kin:'kin',"same?":'distinct from'};
const order={established:0,hypothesis:1,rejected:2,boundary:3};
function relationsOf(id){ return EDGES.filter(e=>e.s===id||e.t===id).map(e=>{ const other=e.s===id?e.t:e.s; let type=e.type; if(e.type==='parent') type=e.s===id?'parent':'child'; return {other,type,a:e.a,claims:e.claims||[],why:e.why,visible:vis(e.a)}; }).sort((a,b)=>order[a.a]-order[b.a]); }
function renderPanel(id){
  const p=byId[id], d=DETAIL[id]||{};
  headEl.innerHTML=`<div class="identity"><div class="portrait ${p.status}">${p.photo?`<img src="${p.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<span>${esc(p.ini)}</span>`}</div><div><div class="status ${p.status}">${p.status==='direct'?'Direct line':p.status}</div><h2>${esc(p.name)}</h2>${p.years?`<div class="years">${esc(p.years)}</div>`:''}${p.qual?`<div class="qual">${esc(p.qual)}</div>`:''}</div></div><div class="chips">${p.flag?`<span class="chip warn">${esc(p.flag)}</span>`:''}<span class="chip mono">${esc(p.pid)}</span>${p.photo?'':'<span class="chip photo" title="No portrait in evidence/. Drop one in to fill the node.">+ portrait</span>'}</div>`;
  const rels=relationsOf(id), docs=d.docs||[], claims=d.claims||[];
  const tabs=[['overview','Overview'],['family','Family',rels.length],['documents','Documents',docs.length],['research','Research',claims.length]];
  tabsEl.innerHTML=tabs.map(([k,l,n])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('');
  tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab; renderPanel(id);});
  let html='';
  if(tab==='overview'){
    html+=`<div class="section"><h3>Supported facts</h3>`;
    if(d.facts) html+=`<dl class="facts">`+d.facts.map(([k,v,c])=>`<dt>${esc(k)}</dt><dd>${esc(v)}${c?`<span class="c">${esc(c)}</span>`:''}${d.conflict&&d.conflict.label===k?`<span class="conflict">Conflict: ${esc(d.conflict.alt)} · ${esc(d.conflict.claims)}</span>`:''}</dd>`).join('')+`</dl>`;
    else html+=`<p class="empty">Registry entry only. ${p.claims} linked claim${p.claims===1?'':'s'}; profile not yet written.</p>`;
    html+=`</div><div class="section"><h3>Identity note</h3><p class="note">${esc(d.note||identityNote(p))}</p></div>`;
    const top=rels.filter(r=>r.visible).slice(0,4); if(top.length) html+=`<div class="section"><h3>Nearest relationships</h3>${relList(top)}</div>`;
    html+=`<div class="section"><button class="focus-btn" id="focusHere">Focus here · ${hops} hop${hops===1?'':'s'}</button></div>`;
  }
  if(tab==='family'){
    const grp=(a,label)=>{ const rs=rels.filter(r=>r.a===a); return rs.length?`<div class="section"><h3>${label}</h3>${relList(rs)}</div>`:''; };
    html+=grp('established','Established')+grp('hypothesis','Hypotheses · unproved')+grp('rejected','Rejected')+grp('boundary','Identity boundaries · do not merge');
    if(!rels.length) html+=`<p class="empty">No recorded relationships.</p>`;
  }
  if(tab==='documents') html+=`<div class="section">`+(docs.length?`<div class="docs">`+docs.map(x=>`<div class="doc"><div class="thumb" data-kind="${x.kind}"></div><div><div class="t">${esc(x.t)}</div><div class="m">${esc(x.m)}</div><div class="why">${esc(x.why)}</div></div></div>`).join('')+`</div>`:`<p class="empty">No local image retained. Citations exist in sources.jsonl; see Research.</p>`)+`</div>`;
  if(tab==='research'){
    html+=`<div class="section"><h3>Linked claims</h3>`+(claims.length?`<ul class="claims">`+claims.map(([c,t,g])=>`<li><span class="id">${c}</span><span>${esc(t)}</span><span class="g">grade ${g}</span></li>`).join('')+`</ul>`:`<p class="empty">${p.claims} claim${p.claims===1?'':'s'} linked in the registry; not expanded in this draft.</p>`)+`</div>`;
    html+=`<div class="section"><h3>Search coverage</h3><p class="note">Coverage from searches.jsonl would list here: repository, jurisdiction, dates inspected, and limitations.</p></div>`;
  }
  bodyEl.innerHTML=html; bodyEl.scrollTop=0;
  bodyEl.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>setSelection(el.dataset.go));
  const fb=document.getElementById('focusHere'); if(fb) fb.onclick=()=>{ flyTo(p.tx,p.ty,1.6); updateAlphas(); };
}
function relList(rs){ return `<ul class="rel">`+rs.map(r=>{ const o=byId[r.other]; return `<li data-go="${o.id}"><span class="pt ${o.status}">${esc(o.ini)}</span><span class="who">${esc(o.name)}<small>${esc(o.qual||'')}${r.why?' — '+esc(r.why):''}</small></span><span class="tag ${r.a}">${relLabel[r.type]||r.type}${r.claims.length?' · '+esc(r.claims[0])+(r.claims.length>1?'+':''):''}</span></li>`; }).join('')+`</ul>`; }
function identityNote(p){ return ({candidate:'Research candidate. The identity label distinguishes a research subject; it does not prove kinship.',unresolved:'Unresolved identity. No located household ties this person to the direct line.',identified:'Identified person. Relationship to the direct line is as shown; nothing further is asserted.',direct:'Direct line, established by reviewed claims.'})[p.status]; }

/* ---------- search ---------- */
const q=document.getElementById('q'), results=document.getElementById('results'); let ri=0, rlist=[];
function closeResults(){ results.classList.remove('open'); }
q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); if(!v){closeResults();return;}
  rlist=PEOPLE.filter(p=>(p.name+' '+(p.qual||'')+' '+p.pid).toLowerCase().includes(v)).slice(0,7); ri=0;
  results.innerHTML=rlist.map((p,i)=>`<button role="option" class="${i===ri?'active':''}" data-id="${p.id}"><b style="background:${col(p)}"></b>${esc(p.name)}<span class="q">${esc((p.qual||'').split(' · ')[0])}</span></button>`).join('');
  results.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.id)); results.classList.toggle('open',rlist.length>0); });
q.addEventListener('keydown',e=>{ if(e.key==='ArrowDown') ri=Math.min(rlist.length-1,ri+1); else if(e.key==='ArrowUp') ri=Math.max(0,ri-1); else if(e.key==='Enter'){ if(rlist[ri]) pick(rlist[ri].id); return; } else return; e.preventDefault(); results.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===ri)); });
q.addEventListener('blur',()=>setTimeout(closeResults,120));
function pick(id){ q.value=''; closeResults(); q.blur(); setSelection(id); }

/* ---------- view controls ---------- */
const vf=document.getElementById('viewFamily'), vr=document.getElementById('viewResearch');
function setView(v){ view=v; vf.setAttribute('aria-pressed',v==='family'); vr.setAttribute('aria-pressed',v==='research'); updateAlphas(); if(selected) renderPanel(selected); }
vf.onclick=()=>setView('family'); vr.onclick=()=>setView('research');
document.getElementById('hyp').onchange=e=>{ showHyp=e.target.checked; updateAlphas(); if(selected) renderPanel(selected); };

/* ---------- boot ---------- */
cam.x=cam.tx=byId.aaron.tx+40; cam.y=cam.ty=byId.aaron.ty+150; cam.k=cam.tk=.95;
requestAnimationFrame(loop);
</script>
